name: deploy

# Reusable deployment of the static site. Settings come from the GitHub environment.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write config for this environment
        env:
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          UI_CLIENT_ID: ${{ vars.UI_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_SCOPE: ${{ vars.API_SCOPE }}
        run: bash scripts/render-config.sh src/config.js
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          skip_app_build: true
          skip_api_build: true
