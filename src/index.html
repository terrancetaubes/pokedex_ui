<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app" data-signed-in="false">
      <aside id="sidebar" class="sidebar" aria-label="Chats">
        <div class="sidebar-top">
          <button id="new-chat" class="btn-new" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
            New chat
          </button>
        </div>
        <nav class="sidebar-nav" aria-label="Recent chats">
          <p class="section-label">Recent</p>
          <ul id="chat-list" class="chat-list"></ul>
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <button id="toggle-sidebar" class="icon-btn" type="button" aria-label="Show or hide sidebar" aria-controls="sidebar" aria-expanded="true">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><path d="M9 4v16" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </button>
          <span class="brand">Pokédex</span>
          <div class="account">
            <button id="sign-in" class="btn-signin" type="button" hidden>Sign in</button>
            <div id="account-menu" class="account-menu" hidden>
              <span id="avatar" class="avatar" aria-hidden="true"></span>
              <span id="user-name" class="user-name"></span>
              <button id="sign-out" class="btn-ghost" type="button">Sign out</button>
            </div>
          </div>
        </header>

        <main id="content" class="content">
          <section id="welcome" class="welcome">
            <h1 id="greeting">Ask about a Pokémon</h1>
            <div id="suggestions" class="suggestions">
              <button class="suggestion" type="button" data-prompt="What type is Gengar and what are its weaknesses?">Gengar's type and weaknesses</button>
              <button class="suggestion" type="button" data-prompt="Which Pokémon evolve from Eevee?">Eevee's evolutions</button>
              <button class="suggestion" type="button" data-prompt="Compare Charizard and Blastoise.">Compare Charizard and Blastoise</button>
            </div>
          </section>

          <section id="thread" class="thread" aria-live="polite" hidden></section>
        </main>

        <footer class="composer-area">
          <p id="signin-panel" class="signin-panel">
            <span id="signin-text">Starting sign-in...</span>
            <button id="sign-in-main" class="btn-primary" type="button">Sign in with Microsoft</button>
          </p>

          <form id="composer" class="composer">
            <textarea id="question" name="question" rows="1" maxlength="2000" placeholder="Ask about a Pokémon" aria-label="Message" required></textarea>
            <div class="composer-bar">
              <span id="char-count" class="char-count" aria-live="off"></span>
              <button id="send" class="btn-send" type="submit" aria-label="Send message" disabled>
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
              </button>
            </div>
          </form>

          <p class="disclaimer">Each question is sent on its own. The agent does not see earlier messages in this chat.</p>
          <p id="status" class="status" role="status"></p>
        </footer>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"
            integrity="sha384-YnOjsoOxSYo65h1BXWnSq24bFbqW8HfzMWSEQxYEMRmjW9Vl1J3HZI3iZxqNYvIi"
            crossorigin="anonymous"></script>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
